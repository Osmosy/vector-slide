<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" fill="none">
  <!-- Vector logo: star → mirror with small stars -->
  <!-- Large star (top) -->
  <path d="M60 8 L68 36 L96 38 L74 56 L82 84 L60 68 L38 84 L46 56 L24 38 L52 36 Z"
        fill="#F97316" stroke="#F97316" stroke-width="1" stroke-linejoin="round"/>
  <!-- Mirror reflection (bottom, faded) -->
  <path d="M60 112 L68 84 L96 82 L74 64 L82 36 L60 52 L38 36 L46 64 L24 82 L52 84 Z"
        fill="#F97316" opacity="0.2" stroke="#F97316" stroke-width="0.5" stroke-linejoin="round" opacity="0.15"/>
  <!-- Mirror line -->
  <line x1="20" y1="60" x2="100" y2="60" stroke="#F97316" stroke-width="0.5" opacity="0.3" stroke-dasharray="3 3"/>
  <!-- Small star 1 -->
  <circle cx="18" cy="22" r="2" fill="#FBBF24"/>
  <path d="M18 18 L19 21 L22 22 L19 23 L18 26 L17 23 L14 22 L17 21 Z" fill="#FBBF24" opacity="0.8"/>
  <!-- Small star 2 -->
  <circle cx="102" cy="18" r="1.5" fill="#FBBF24"/>
  <path d="M102 15 L103 17 L105 18 L103 19 L102 21 L101 19 L99 18 L101 17 Z" fill="#FBBF24" opacity="0.7"/>
  <!-- Small star 3 -->
  <path d="M104 50 L105 52 L107 53 L105 54 L104 56 L103 54 L101 53 L103 52 Z" fill="#FBBF24" opacity="0.5"/>
  <!-- Small star 4 -->
  <path d="M14 48 L15 50 L17 51 L15 52 L14 54 L13 52 L11 51 L13 50 Z" fill="#FBBF24" opacity="0.5"/>
</svg>